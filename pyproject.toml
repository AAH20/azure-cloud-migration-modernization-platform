[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "migrationforge"
version = "0.1.0"
description = "Azure cloud migration, VMware modernization, dependency mapping and FinOps planning"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ahmed Hassan"}]

[project.scripts]
migrationforge = "migrationforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
