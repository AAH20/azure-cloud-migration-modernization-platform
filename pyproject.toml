[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "migrationforge"
version = "1.0.0"
description = "Azure cloud migration, VMware modernization, dependency mapping and FinOps planning"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ahmed Hassan"}]
dependencies = ["fastapi>=0.116,<1", "pydantic>=2.11,<3", "uvicorn>=0.35,<1"]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8.4,<9"]

[project.scripts]
migrationforge = "migrationforge.cli:main"
migrationforge-api = "migrationforge.controlplane:main"

[tool.setuptools.packages.find]
where = ["src"]
