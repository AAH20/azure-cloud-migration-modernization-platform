name: Azure cloud migration assessment CI
on:
  push:
  pull_request:
jobs:
  migration-assessment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: PYTHONPATH=src python -m migrationforge.cli examples/vmware-to-azure/250-vm-estate.json --output generated/250-vm-assessment
      - run: git diff --exit-code generated/250-vm-assessment
      - run: python -m compileall -q src tests
      - run: docker build -t migrationforge:${{ github.sha }} .
