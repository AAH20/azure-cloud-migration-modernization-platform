apiVersion: apps/v1
kind: StatefulSet
metadata: {name: migrationforge}
spec:
  serviceName: migrationforge
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: migrationforge}}
  template:
    metadata: {labels: {app.kubernetes.io/name: migrationforge}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: control-plane
          image: ghcr.io/aah20/migrationforge:1.0.0
          imagePullPolicy: Always
          ports: [{name: http, containerPort: 8080}]
          env: [{name: MIGRATIONFORGE_ENV, value: production}, {name: MIGRATIONFORGE_DB, value: /data/migrationforge.db}]
          envFrom: [{secretRef: {name: migrationforge-secrets}}]
          readinessProbe: {httpGet: {path: /health/ready, port: http}}
          livenessProbe: {httpGet: {path: /health/live, port: http}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts: [{name: state, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: state}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: migrationforge}
spec:
  selector: {app.kubernetes.io/name: migrationforge}
  ports: [{name: http, port: 80, targetPort: http}]
